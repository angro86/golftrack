# Green Hills Country Club — GSPro course build config
course:
  name: Green Hills Country Club
  slug: green-hills
  location: Millbrae, CA, USA
  architect: Alister MacKenzie (1930)
  holes: 18

# Course center (from the Google Maps pin)
center:
  lat: 37.6047
  lon: -122.4085

# Capture radii (meters)
course_radius_m: 850      # playable course + immediate surrounds
scenery_radius_m: 1600    # neighborhood / mid-distance scenery

# Projected CRS for accurate lengths/areas — UTM zone 10N (SF Peninsula)
projected_epsg: 32610

# Terrain capture: square box centered on the course.
# heightmap_res should be 2^n+1 for Unity terrain (513/1025/2049/4097).
terrain:
  box_m: 2048
  heightmap_res: 2049
  dem_service: https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer

overpass:
  endpoint: https://overpass-api.de/api/interpreter
  user_agent: "golftrack-gspro/0.1 (angro86@gmail.com)"

# USGS 3DEP Entwine Point Tiles (public AWS). The 2023 dense collection.
lidar:
  ept_url: https://s3-us-west-2.amazonaws.com/usgs-lidar-public/CA_CaliforniaGaps_3_B23/ept.json
  max_depth: 12          # octree depth -> ~sub-meter canopy density
  min_tree_height_m: 2.5 # ignore shrubs/cars below this
  min_tree_spacing_m: 4.0

# Landmarks for orientation / viewshed annotations
landmarks:
  SFO airport: {lat: 37.6213, lon: -122.3790}
  Downtown SF: {lat: 37.7790, lon: -122.4180}

# Authoritative scorecard (from the official/GHIN card). Hole arrays are 1..18.
scorecard:
  source: "Official scorecard (GHIN) — longest current tees"
  par_by_hole:  [4, 5, 5, 3, 4, 4, 3, 4, 4, 4, 4, 4, 3, 4, 3, 5, 4, 4]
  hcp_by_hole:  [13, 15, 5, 11, 1, 7, 17, 9, 3, 18, 6, 16, 14, 2, 10, 12, 8, 4]
  tees:
    - name: "Black/Blue Combo"
      color: "#101820"
      par: 71
      yards: 6428
      rating: 72.2
      slope: 143
      holes_yards: [343, 525, 513, 168, 414, 426, 141, 378, 358,
                    343, 348, 359, 163, 373, 173, 534, 411, 458]
